<!-- options.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>插件配置</title>
    <link rel="stylesheet" href="css/options.css">
</head>
<body>
<div class="container">
    <h1 class="title">插件配置</h1>
    <form class="form" autocomplete="off">
        <div class="input-container">
            <label for="level1" class="label">采集层级:</label>
            <div class="input-wrapper">
                <div>
                    <input type="radio" id="level1" checked name="level" value="1">
                    <label for="level1">1级</label>
                    <input type="radio" id="level2" name="level" value="2">
                    <label for="level2">2级</label>
                    <input type="radio" id="level3" name="level" value="3">
                    <label for="level3">3级</label>
                </div>
            </div>
        </div>
        <div class="input-container">
            <label for="provider" class="label">AI 服务:</label>
            <div class="input-wrapper">
                <select id="provider" class="input-field">
                    <option value="anthropic">Anthropic</option>
                    <option value="openai">OpenAI</option>
                    <option value="openrouter">OpenRouter</option>
                </select>
            </div>
        </div>
        <div class="input-container">
            <label for="apiKey" class="label">API Key:</label>
            <div class="input-wrapper">
                <input type="password" id="apiKey" class="input-field" placeholder="填写后自动拉取模型列表">
            </div>
        </div>
        <div class="input-container input-container-top">
            <label for="model" class="label">模型:</label>
            <div class="model-box">
                <input type="search" id="modelSearch" class="model-search" placeholder="搜索模型" hidden>
                <div class="model-row">
                    <div class="input-wrapper model-wrapper">
                        <select id="model" class="input-field"></select>
                    </div>
                    <button id="refreshModels" type="button" class="refresh-button">刷新</button>
                </div>
                <div id="modelStatus" class="model-status"></div>
            </div>
        </div>
        <div class="input-container">
            <label for="analysisPrompt" class="label">分析提示词:</label>
            <div class="input-wrapper">
                <textarea id="analysisPrompt" class="input-field" rows="8" placeholder="可选。留空则使用默认的关键词分析提示词"></textarea>
            </div>
        </div>
        <div id="saveStatus" class="save-status">修改会自动保存</div>
    </form>
</div>
<script type="text/javascript" src="js/llm.js"></script>
<script type="text/javascript" src="js/options.js"></script>
</body>
</html>
